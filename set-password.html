<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CardioPulmo — Set a new password</title>
<link rel="stylesheet" href="globals.css?v=15">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="pb-client.js?v=2"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .sp{max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px}
  .sp h1{font-size:20px;margin:0}
  .sp input{padding:11px;border-radius:10px;border:1px solid rgba(111,211,255,.25);
            background:rgba(7,11,22,.7);color:var(--txt,#e6edf3);font-size:16px}
  .sp .msg{font-size:13px;min-height:18px}
</style>
</head>
<body>

<!-- The magic link lands here. Postbase's /verify has already consumed the token,
     stamped email_verified and issued the session cookie by this point, so this page
     only has to collect a password — it never sees a token and never names an account. -->
<div class="sp">
  <div class="ovlbrand" style="font-size:22px">CARDIOPULMO</div>
  <h1 id="spTitle">Set a new password</h1>
  <div class="note" id="spWho">Checking your link…</div>

  <div id="spForm" style="display:none;flex-direction:column;gap:10px">
    <input id="spPass" type="password" autocomplete="new-password" placeholder="New password (at least 6 characters)">
    <input id="spPass2" type="password" autocomplete="new-password" placeholder="Type it again">
    <button id="spSave" class="pbtn">Save password</button>
  </div>

  <div class="msg" id="spMsg"></div>
  <a id="spBack" href="/" class="note" style="display:none">← Back to CardioPulmo</a>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function msg(t, bad) { var e = $('spMsg'); e.textContent = t || ''; e.style.color = bad ? '#ff6b6b' : '#2FBF8F'; }

  /* The session is the whole authorisation. If the link was already used, expired, or
     opened in a browser that never received the cookie, there is no session and there is
     nothing this page can do — say so plainly instead of showing a form that will 401. */
  (async function () {
    var r = await window.pb.auth.getSession();
    var u = r && r.data && r.data.session && r.data.session.user;
    if (!u) {
      $('spWho').textContent = 'This link has expired, or it was opened in a different browser from the one that requested it.';
      $('spTitle').textContent = 'Link no longer valid';
      $('spBack').style.display = 'block';
      $('spBack').textContent = '← Request a new link';
      return;
    }
    $('spWho').textContent = 'Setting a new password for ' + (u.email || 'your account') + '.';
    $('spForm').style.display = 'flex';
  })();

  $('spSave').onclick = async function () {
    var a = $('spPass').value, b = $('spPass2').value;
    if (a.length < 6) { msg('Password must be at least 6 characters.', true); return; }
    if (a !== b) { msg('The two passwords do not match.', true); return; }
    this.disabled = true; msg('Saving…');
    var r = await window.pb.auth.setPassword(a);
    this.disabled = false;
    if (r.error) { msg('Not saved — ' + r.error.message, true); return; }
    msg('✓ Password changed. You are signed in.');
    $('spForm').style.display = 'none';
    $('spBack').style.display = 'block';
    setTimeout(function () { location.href = '/'; }, 1500);
  };
})();
</script>
</body>
</html>
